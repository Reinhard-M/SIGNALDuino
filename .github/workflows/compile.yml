name: PlatformIO Build

# Läuft bei jedem Push (auf jeden Zweig) und lässt sich unter "Actions" auch von Hand starten.
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # scheitert eine Variante, wird die andere trotzdem fertig gebaut
      matrix:
        env:
          - Maple_sduino_USB      # USB-Sduino am Raspberry Pi 5 (USB-Anschluss)
          - Maple_sduino_serial   # 8266 / myLAN156 (Maple hinter der Tasmota-Bridge, serielle Schnittstelle)
    name: ${{ matrix.env }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO-Pakete zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Projekt kompilieren
        run: pio run -e ${{ matrix.env }}

      - name: Fertige Firmware speichern
        uses: actions/upload-artifact@v4
        with:
          # Ein Download je Variante, z. B. "firmware-Maple_sduino_USB".
          # Enthalten ist nur die .bin-Datei; ihr Name enthält Variante und Build-Datum,
          # z. B. Maple_sduino_USB_422dev261108.bin (siehe extra_script.py).
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: error

      - name: Zusammenfassung
        run: |
          echo "### ${{ matrix.env }}" >> "$GITHUB_STEP_SUMMARY"
          ls -l .pio/build/${{ matrix.env }}/*.bin | awk '{print "- " $9 " (" $5 " Byte)"}' >> "$GITHUB_STEP_SUMMARY"
